# Agent Relay — Alerting rules.
groups:
  - name: agent-relay-user-impact
    interval: 30s
    rules:
      - alert: HighErrorRate
        expr: |
          rate(agent_relay_http_server_duration_count{http_status_code=~"5.."}[5m])
          /
          rate(agent_relay_http_server_duration_count[5m])
          > 0.05
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "{{ $labels.http_method }} {{ $labels.http_route }} error rate above 5%"
          description: >
            The endpoint {{ $labels.http_method }} {{ $labels.http_route }}
            returned 5xx errors at a rate above 5 % over the last 5 minutes.
            Deployed version and recent change log are in the incident packet.
          impact: "Users receiving 5xx responses from Agent Relay API"
          runbook: "/incident-response/runbooks/rollback.sh"
